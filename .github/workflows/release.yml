name: Release Pico

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build release package
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$SIGNING_IDENTITY" && -n "$APPLE_TEAM_ID" ]]; then
            scripts/build-release-dmg.sh
          else
            xcodebuild archive -project Pico.xcodeproj -scheme Pico -archivePath build/Pico.xcarchive -configuration Release CODE_SIGNING_ALLOWED=NO
            mkdir -p build/release
            ditto -c -k --sequesterRsrc --keepParent build/Pico.xcarchive/Products/Applications/Pico.app build/release/Pico-${RELEASE_TAG}.zip
          fi
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" build/release/* --clobber
