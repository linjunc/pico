name: Release Pico

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild archive -project Pico.xcodeproj -scheme Pico -archivePath build/Pico.xcarchive -configuration Release CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned preview
        run: ditto -c -k --sequesterRsrc --keepParent build/Pico.xcarchive/Products/Applications/Pico.app build/Pico-${RELEASE_TAG}.zip
      - name: Upload preview asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" build/Pico-${RELEASE_TAG}.zip --clobber

