:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);

}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);

  min-height: 26px;

  padding: 0 8px;

  background: var(--secondary);
  cursor: inherit;
  font: inherit;

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),

.form-select:not(:disabled):hover {

}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;

.form-check-input {

  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:

    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

          &lt;div class=&quot;modal-backdrop&quot; id=&quot;import-modal&quot;&gt;&lt;div class=&quot;modal&quot;&gt;&lt;h3 id=&quot;import-title&quot;&gt;导入预览&lt;/h3&gt;&lt;p&gt;已解析 2,486 条记录，其中 83 条与 Pico 中的现有内容重复。确认后将导入 2,403 条，原有数据不会被覆盖。&lt;/p&gt;&lt;div class=&quot;settings-card&quot;&gt;&lt;div class=&quot;setting-row&quot;&gt;&lt;div class=&quot;setting-copy&quot;&gt;&lt;strong&gt;文本与链接&lt;/strong&gt;&lt;span&gt;2,116 条&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;setting-row&quot;&gt;&lt;div class=&quot;setting-copy&quot;&gt;&lt;strong&gt;图片与文件&lt;/strong&gt;&lt;span&gt;287 条&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;modal-actions&quot;&gt;&lt;button class=&quot;button&quot; data-close-import&gt;取消&lt;/button&gt;&lt;button class=&quot;button primary&quot; data-close-import&gt;开始导入&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

        &lt;section class=&quot;page&quot; data-view=&quot;updates&quot;&gt;
          &lt;div class=&quot;page-head&quot;&gt;&lt;div&gt;&lt;h2&gt;更新与关于&lt;/h2&gt;&lt;p&gt;签名、公证、可验证的发布体验。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;grid-2&quot;&gt;&lt;div class=&quot;settings-card&quot;&gt;&lt;h3&gt;软件更新&lt;/h3&gt;&lt;div class=&quot;setting-row&quot;&gt;&lt;div class=&quot;setting-copy&quot;&gt;&lt;strong&gt;自动检查更新&lt;/strong&gt;&lt;span&gt;通过 Sparkle 获取已签名的新版本&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;switch on&quot;&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;setting-row&quot;&gt;&lt;div class=&quot;setting-copy&quot;&gt;&lt;strong&gt;当前版本&lt;/strong&gt;&lt;span&gt;Pico 1.0.0 · 已是最新版本&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;button&quot;&gt;检查更新&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;settings-card&quot;&gt;&lt;h3&gt;关于 Pico&lt;/h3&gt;&lt;div class=&quot;setting-row&quot;&gt;&lt;div class=&quot;hero-icon&quot; style=&quot;width:44px;height:44px;border-radius:13px;margin:0;font-size:17px&quot;&gt;P&lt;/div&gt;&lt;div class=&quot;setting-copy&quot;&gt;&lt;strong&gt;Pico&lt;/strong&gt;&lt;span&gt;小巧、快速的 Mac 剪贴板工具&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;setting-row&quot;&gt;&lt;div class=&quot;setting-copy&quot;&gt;&lt;strong&gt;本地数据&lt;/strong&gt;&lt;span&gt;打开 Pico 数据目录或清理非收藏历史&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;button&quot;&gt;管理数据&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;/section&gt;
      &lt;/main&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;pico-prototype&#x27;);
      const pages = root.querySelectorAll(&#x27;.page&#x27;);
      root.querySelectorAll(&#x27;.nav button[data-page]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelectorAll(&#x27;.nav button[data-page]&#x27;).forEach(item =&gt; item.classList.remove(&#x27;active&#x27;));
        button.classList.add(&#x27;active&#x27;);
        pages.forEach(page =&gt; page.classList.toggle(&#x27;active&#x27;, page.dataset.view === button.dataset.page));
      }));

      const panel = root.querySelector(&#x27;#clipboard-panel&#x27;);
      root.querySelectorAll(&#x27;#layout-switch button&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelectorAll(&#x27;#layout-switch button&#x27;).forEach(item =&gt; item.classList.remove(&#x27;active&#x27;));
        button.classList.add(&#x27;active&#x27;);
        panel.className = &#x27;clipboard-panel &#x27; + button.dataset.layout;
      }));

      const search = root.querySelector(&#x27;#clip-search&#x27;);
      search.addEventListener(&#x27;input&#x27;, () =&gt; {
        const query = search.value.trim().toLowerCase();
        root.querySelectorAll(&#x27;.clip&#x27;).forEach(clip =&gt; { clip.style.display = clip.innerText.toLowerCase().includes(query) ? &#x27;&#x27; : &#x27;none&#x27;; });
      });

      let selectedClip = root.querySelector(&#x27;.clip.selected&#x27;);
      const menu = root.querySelector(&#x27;#context-menu&#x27;);
      root.querySelectorAll(&#x27;.clip&#x27;).forEach(clip =&gt; {
        clip.addEventListener(&#x27;click&#x27;, () =&gt; {
          root.querySelectorAll(&#x27;.clip&#x27;).forEach(item =&gt; item.classList.remove(&#x27;selected&#x27;));
          clip.classList.add(&#x27;selected&#x27;); selectedClip = clip;
        });
        clip.addEventListener(&#x27;contextmenu&#x27;, event =&gt; {
          event.preventDefault(); selectedClip = clip;
          root.querySelectorAll(&#x27;.clip&#x27;).forEach(item =&gt; item.classList.toggle(&#x27;selected&#x27;, item === clip));
          const desktopRect = root.querySelector(&#x27;#desktop&#x27;).getBoundingClientRect();
          menu.style.left = Math.min(event.clientX - desktopRect.left, desktopRect.width - 180) + &#x27;px&#x27;;
          menu.style.top = Math.min(event.clientY - desktopRect.top, desktopRect.height - 220) + &#x27;px&#x27;;
          menu.classList.add(&#x27;show&#x27;);
        });
      });
      const visibleClips = () =&gt; Array.from(root.querySelectorAll(&#x27;.clip&#x27;)).filter(clip =&gt; clip.style.display !== &#x27;none&#x27;);
      const moveSelection = direction =&gt; {
        const clips = visibleClips();
        if (!clips.length) return;
        const currentIndex = Math.max(0, clips.indexOf(selectedClip));
        const nextIndex = (currentIndex + direction + clips.length) % clips.length;
        clips.forEach((clip, index) =&gt; clip.classList.toggle(&#x27;selected&#x27;, index === nextIndex));
        selectedClip = clips[nextIndex];
      };
      root.querySelector(&#x27;#previous-clip&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; moveSelection(-1));
      root.querySelector(&#x27;#next-clip&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; moveSelection(1));
      root.addEventListener(&#x27;keydown&#x27;, event =&gt; {
        if (!root.querySelector(&#x27;[data-view=&quot;panel&quot;]&#x27;).classList.contains(&#x27;active&#x27;)) return;
        if (event.target === search &amp;&amp; event.key !== &#x27;Escape&#x27;) return;
        if (event.key === &#x27;ArrowLeft&#x27;) { event.preventDefault(); moveSelection(-1); }
        if (event.key === &#x27;ArrowRight&#x27;) { event.preventDefault(); moveSelection(1); }
        if (event.key.toLowerCase() === &#x27;t&#x27;) { event.preventDefault(); translateSelectedClip(); }
        if (event.key === &#x27;Enter&#x27;) { event.preventDefault(); showToast(event.shiftKey ? &#x27;已粘贴为纯文本&#x27; : &#x27;已粘贴到原应用&#x27;); }
        if (event.key === &#x27;Escape&#x27;) { event.preventDefault(); menu.classList.remove(&#x27;show&#x27;); preview.classList.remove(&#x27;show&#x27;); showToast(&#x27;面板已关闭 · 焦点返回原应用&#x27;); }
      });
      root.querySelector(&#x27;#desktop&#x27;).addEventListener(&#x27;click&#x27;, event =&gt; { if (!menu.contains(event.target)) menu.classList.remove(&#x27;show&#x27;); });
      root.querySelector(&#x27;#pin-panel&#x27;).addEventListener(&#x27;click&#x27;, event =&gt; event.currentTarget.classList.toggle(&#x27;on&#x27;));

      const toast = root.querySelector(&#x27;#toast&#x27;);
      const showToast = text =&gt; { toast.textContent = text; toast.classList.add(&#x27;show&#x27;); setTimeout(() =&gt; toast.classList.remove(&#x27;show&#x27;), 1200); };
      const island = root.querySelector(&#x27;#translation-island&#x27;);
      const islandTitle = root.querySelector(&#x27;#island-title&#x27;);
      const islandResult = root.querySelector(&#x27;#island-result&#x27;);
      const islandSource = root.querySelector(&#x27;#island-source&#x27;);
      const islandFullResult = root.querySelector(&#x27;#island-full-result&#x27;);
      function translateSelectedClip() {
        if (!selectedClip || selectedClip.style.display === &#x27;none&#x27;) return;
        selectedClip.classList.add(&#x27;translation-busy&#x27;);
        menu.classList.remove(&#x27;show&#x27;);
        island.classList.remove(&#x27;show&#x27;, &#x27;expanded&#x27;, &#x27;error&#x27;);
        root.querySelector(&#x27;#island-copy-button&#x27;).textContent = &#x27;复制&#x27;;
        setTimeout(() =&gt; {
          selectedClip.classList.remove(&#x27;translation-busy&#x27;);

        &#x27;&lt;div class=&quot;hero-icon&quot;&gt;⌘&lt;/div&gt;&lt;h2&gt;允许快速粘贴&lt;/h2&gt;&lt;p&gt;Pico 只在你选择历史条目时模拟一次 Command–V，不会读取键盘输入。&lt;/p&gt;&lt;div class=&quot;permission-box&quot;&gt;&lt;strong&gt;辅助功能权限&lt;/strong&gt;&lt;span&gt;尚未授权 · 前往系统设置开启&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;button primary&quot;&gt;打开系统设置&lt;/button&gt;&#x27;,
        &#x27;&lt;div class=&quot;hero-icon&quot;&gt;✓&lt;/div&gt;&lt;h2&gt;保持 Pico 随时可用&lt;/h2&gt;&lt;p&gt;建议登录时启动，并保留一个月历史。收藏内容不会被自动清理。&lt;/p&gt;&lt;div class=&quot;permission-box&quot;&gt;&lt;strong&gt;登录时启动　　开启&lt;/strong&gt;&lt;span&gt;历史保留期限　　1 个月&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;button primary&quot;&gt;完成设置&lt;/button&gt;&#x27;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
