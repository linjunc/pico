<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pico Icon Exploration</title>
  <style>
    :root { color-scheme: dark; --bg:#080b10; --panel:#111720; --text:#edf7ff; --muted:#8d9aaa; --cyan:#48ddff; --blue:#4388ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family: -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif; background:radial-gradient(circle at 20% 0%,#172b43 0,#080b10 46%); color:var(--text); padding:54px; }
    header { max-width:1160px; margin:0 auto 34px; display:flex; align-items:end; justify-content:space-between; }
    h1 { margin:0; font-size:34px; letter-spacing:-.04em; }
    p { margin:8px 0 0; color:var(--muted); }
    .grid { max-width:1160px; margin:auto; display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
    .card { min-height:330px; padding:22px; border:1px solid #ffffff12; background:#0d131caa; border-radius:24px; box-shadow:0 18px 50px #0006; transition:.25s; }
    .card:hover { transform:translateY(-5px); border-color:#48ddff66; background:#121c28; }
    .stage { height:230px; display:grid; place-items:center; border-radius:18px; background:radial-gradient(circle at 50% 45%,#182b3e 0,#0a0e15 58%); overflow:hidden; }
    .label { margin-top:18px; display:flex; justify-content:space-between; align-items:center; }
    .name { font-weight:700; font-size:16px; } .desc { color:var(--muted); font-size:12px; margin-top:5px; }
    .badge { color:#061018; background:var(--cyan); border-radius:999px; padding:5px 9px; font-size:11px; font-weight:700; }
    .icon { width:150px; height:150px; position:relative; display:grid; place-items:center; filter:drop-shadow(0 18px 24px #0008); }
    .tile { display:none; }
    .pc { position:relative; z-index:2; font-size:82px; font-weight:800; letter-spacing:-.38em; transform:translateX(-11px); color:#eafcff; text-shadow:0 0 24px #48ddff55; mix-blend-mode:screen; }
    .pc span:last-child { display:inline-block; position:relative; z-index:-1; color:#48ddff; font-size:72px; opacity:.95; transform:translate(-8px, 7px) scale(.9); }
    .orbit { position:absolute; width:174px; height:54px; border:3px solid #9af3ff; border-left-color:transparent; border-right-color:transparent; border-radius:50%; transform:rotate(-32deg); z-index:3; opacity:.85; }
    .slice { position:absolute; z-index:3; width:190px; height:12px; background:#48ddff; transform:rotate(-32deg); opacity:.72; box-shadow:0 0 0 5px #53e7ff22; }
    .ring { position:absolute; z-index:3; width:94px; height:94px; border:14px solid #061321; border-right-color:transparent; border-radius:50%; transform:rotate(-35deg); }
    .speed { position:absolute; z-index:3; width:190px; height:95px; border-top:7px solid #061321; border-bottom:7px solid #061321; transform:skewX(-20deg) rotate(-28deg); opacity:.9; }
    .double .pc { text-shadow:-10px 8px 0 #4388ff55, 10px -8px 0 #48ddff44; }
    .fluid .pc { transform:rotate(8deg) translateX(-4px); }
    .mark { width:142px; height:142px; overflow:visible; fill:none; stroke:#eafcff; stroke-width:9; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 0 15px #48ddff44); }
    .mark .accent { stroke:#48ddff; stroke-width:7; }
    .mark.fold { stroke:none; filter:drop-shadow(0 12px 18px #0008); }
    .mark.fold .solid { fill:url(#none); fill:#48dfff; }
    .mark.fold .cut { fill:#0a0e15; }
    .mark.fold .foldline { fill:none; stroke:#b9f7ff; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; opacity:.9; }
    .mark.fold .accent { fill:none; stroke:#0a5dba; stroke-width:5; stroke-linecap:round; }
    .small { transform:scale(.72); }
    @media(max-width:850px){ body{padding:24px}.grid{grid-template-columns:1fr 1fr} }
    @media(max-width:580px){.grid{grid-template-columns:1fr} header{display:block}}
  </style>
</head>
<body>
  <header><div><h1>Pico icon directions</h1><p>以 P + C 为核心，探索更有动感和品牌感的方向</p></div><span class="badge">v0.1 exploration</span></header>
  <main class="grid">
    <article class="card"><div class="stage"><div class="icon"><div class="tile"></div><div class="orbit"></div><div class="pc">P<span>C</span></div></div></div><div class="label"><div><div class="name">01 · Orbit</div><div class="desc">P 与 C 被同一条轨道连接</div></div><span class="badge">推荐</span></div></article>
    <article class="card"><div class="stage"><div class="icon"><div class="tile"></div><div class="slice"></div><div class="pc">P<span>C</span></div></div></div><div class="label"><div><div class="name">02 · Slice</div><div class="desc">像剪切动作一样的速度切片</div></div></div></article>
    <article class="card"><div class="stage"><div class="icon"><div class="tile"></div><div class="ring"></div><div class="pc">P<span>C</span></div></div></div><div class="label"><div><div class="name">03 · Loop</div><div class="desc">循环、历史、回到过去</div></div></div></article>
    <article class="card"><div class="stage"><div class="icon"><div class="tile"></div><div class="speed"></div><div class="pc">P<span>C</span></div></div></div><div class="label"><div><div class="name">04 · Velocity</div><div class="desc">键盘优先，快速呼出与粘贴</div></div></div></article>
    <article class="card"><div class="stage"><div class="icon double"><div class="tile"></div><div class="tile"></div><div class="pc">P<span>C</span></div></div></div><div class="label"><div><div class="name">05 · Double</div><div class="desc">两层内容叠合，表达剪贴板历史</div></div></div></article>
    <article class="card"><div class="stage"><div class="icon fluid"><div class="tile"></div><div class="pc">P<span>C</span></div></div></div><div class="label"><div><div class="name">06 · Fluid</div><div class="desc">更柔和、更高级的流体轮廓</div></div></div></article>
  </main>
</body>
<script>
  const marks = [
    '<svg class="mark fold" viewBox="0 0 150 150"><path class="solid" d="M31 24h66l22 22v80H31z"/><path class="cut" d="M53 112V48h29c19 0 29 9 29 22s-10 22-29 22H53"/><path class="foldline" d="M97 24v23h22"/></svg>',
    '<svg class="mark fold" viewBox="0 0 150 150"><path class="solid" d="M27 34l72-13 25 25-13 72-72 13-25-25z"/><path class="cut" d="M52 112V48h28c18 0 28 9 28 21s-10 21-28 21H52"/><path class="foldline" d="M99 21l-4 27 26-2"/></svg>',
    '<svg class="mark fold" viewBox="0 0 150 150"><path class="solid" d="M40 20h57l22 22v87H40z"/><path class="cut" d="M61 112V48h25c18 0 27 9 27 21s-9 21-27 21H61"/><path class="foldline" d="M97 20v23h22"/><path class="accent" d="M119 55v55"/></svg>',
    '<svg class="mark fold" viewBox="0 0 150 150"><path class="solid" d="M25 42l75-20 25 25-20 75-75 20-25-25z"/><path class="cut" d="M53 113V47h28c18 0 28 9 28 22s-10 22-28 22H53"/><path class="foldline" d="M100 22l-3 27 28-2"/></svg>',
    '<svg class="mark fold" viewBox="0 0 150 150"><path class="solid" d="M31 27h67l21 21v78H31z"/><path class="cut" d="M52 112V48h28c18 0 28 9 28 21s-10 21-28 21H52"/><path class="foldline" d="M98 27v22h21"/><path class="accent" d="M35 38h55"/></svg>',
    '<svg class="mark fold" viewBox="0 0 150 150"><path class="solid" d="M35 25h62l20 21v80H35z"/><path class="cut" d="M57 112V48h27c18 0 28 9 28 21s-10 21-28 21H57"/><path class="foldline" d="M97 25v22h20"/><path class="accent" d="M117 57v47"/></svg>'
  ];
  document.querySelectorAll('.icon').forEach((node, i) => node.innerHTML = marks[i]);
</script>
</html>
